default_settings: null
behaviors:
  cooking:
    trainer_type: ppo                                  # Use PPO by default :contentReference[oaicite:6]{index=6}
    hyperparameters:
      batch_size: 1024                                # Number of experiences per gradient update :contentReference[oaicite:7]{index=7}
      buffer_size: 10240                              # On-policy buffer size before each update :contentReference[oaicite:8]{index=8}
      learning_rate: 3.0e-4                           # Initial LR for optimizer :contentReference[oaicite:9]{index=9}
      beta: 5.0e-3                                    # Entropy bonus weight :contentReference[oaicite:10]{index=10}
      epsilon: 0.2                                    # PPO clip parameter :contentReference[oaicite:11]{index=11}
      lambd: 0.95                                     # GAE lambda :contentReference[oaicite:12]{index=12}
      num_epoch: 3                                    # Number of passes through buffer :contentReference[oaicite:13]{index=13}
      learning_rate_schedule: linear                  # Linear LR decay :contentReference[oaicite:14]{index=14}

    network_settings:
      normalize: false                                # No obs normalization :contentReference[oaicite:15]{index=15}
      hidden_units: 256                               # MLP width :contentReference[oaicite:16]{index=16}
      num_layers: 4                                   # MLP depth :contentReference[oaicite:17]{index=17}
      vis_encode_type: simple                         # Simple CNN for visual obs :contentReference[oaicite:18]{index=18}

    reward_signals:
      extrinsic:
        gamma: 0.99                                   # Discount factor :contentReference[oaicite:19]{index=19}
        strength: 1.0                                 # Weight on extrinsic reward :contentReference[oaicite:20]{index=20}

    time_horizon: 64                                  # Steps per agent per rollout :contentReference[oaicite:24]{index=24}
    summary_freq: 50000                               # Steps between TensorBoard logs :contentReference[oaicite:25]{index=25}
    max_steps: 500000000
env_settings:
  env_path: null
  env_args: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  timeout_wait: 60
  seed: -1
  max_lifetime_restarts: 10
  restarts_rate_limit_n: 1
  restarts_rate_limit_period_s: 60
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
  no_graphics_monitor: false
environment_parameters: null
checkpoint_settings:
  run_id: cooking_run
  initialize_from: null
  load_model: false
  resume: false
  force: true
  train_model: false
  inference: false
  results_dir: results
torch_settings:
  device: null
debug: false
